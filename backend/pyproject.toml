[project]
name = "resumefit"
version = "0.1.0"
description = "Resume Fit 本地简历定制服务"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "python-docx>=1.1",
    "pypdf>=5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    # starlette 的 TestClient 已弃用 httpx，改用 httpx2；仅测试需要。
    "httpx2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["resumefit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
